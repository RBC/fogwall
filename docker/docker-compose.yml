services:

  # ── fogwall ───────────────────────────────────────────────────────────────────
  fogwall:
    build:
      context: ..
      args:
        # The builder image has no git binary, so the commit is passed in. Export BUILD_COMMIT to have the
        # local stack name its commit; unset it and BuildInfo reports 'unknown', which is harmless.
        BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
    # Stable tag for the built image so a pre-built image can be reused instead of
    # rebuilt. Local `compose.sh -- up -d --build` builds and tags it here; CI builds
    # the image once, `docker load`s it under this tag, and the smoke-test matrix jobs
    # then `up -d` (no --build) and reuse it.
    image: fogwall:local
    ports:
      - "8080:8080"
      # Uncomment below to enable TLS termination
#      - "8443:8443"
    volumes:
      - ./fogwall-docker-default.yml:/app/conf/fogwall-docker-default.yml:ro
      # On hosts with Podman+SELinux the mount above is unreadable by the container and the config profile is
      # silently skipped — replace that line with this one so podman relabels the file (see CONTRIBUTING.md):
#      - ./fogwall-docker-default.yml:/app/conf/fogwall-docker-default.yml:z
      # Uncomment to enable debug logging (see docker/log4j2-debug.xml):
#      - ./log4j2-debug.xml:/app/conf/log4j2-debug.xml:ro
      # Uncomment to enable TLS, presumes self-signed localhost certs (see test/make-certs.sh):
#      - ./tls:/app/conf/tls:z
    depends_on:
      gitea:
        condition: service_healthy
    environment:
      FOGWALL_API_KEY: "change-me-in-production"
      FOGWALL_CONFIG_PROFILES: docker-default
      # Uncomment together with the volume mount above to activate debug logging:
#      JAVA_TOOL_OPTIONS: -Dlog4j2.configurationFile=/app/conf/log4j2-debug.xml
      # Uncomment the tls volume + 8443 port above and these two to terminate TLS (see test/make-certs.sh):
#      FOGWALL_SERVER_TLS_CERTIFICATE: /app/conf/tls/localhost.crt
#      FOGWALL_SERVER_TLS_KEY: /app/conf/tls/localhost.key
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # ── Gitea (local git server) ───────────────────────────────────────────────
  gitea:
    image: docker.io/gitea/gitea:1.25-rootless
    ports:
      - "3000:3000"
      - "3022:2222"    # Gitea SSH (rootless listens on 2222; host maps to 3022)
    environment:
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__security__SECRET_KEY: "change-me-in-production"
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__DOMAIN: "localhost"
      GITEA__server__SSH_DOMAIN: "localhost"
      GITEA__server__SSH_PORT: "3022"          # advertised port (what git clone URLs show)
      GITEA__server__SSH_LISTEN_PORT: "2222"   # internal listen port
      GITEA__server__START_SSH_SERVER: "true"
      GITEA__database__DB_TYPE: "sqlite3"
      GITEA__log__LEVEL: "Warn"
      GITEA__repository__DEFAULT_BRANCH: "main"
    volumes:
      - gitea-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/healthz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ── PostgreSQL (optional — start with: docker compose --profile postgres up) ─
  postgres:
    image: docker.io/postgres:17-alpine
    profiles: [postgres]
    environment:
      POSTGRES_DB: fogwall
      POSTGRES_USER: fogwall
      POSTGRES_PASSWORD: fogwall
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fogwall"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── MySQL (optional — start with: docker compose --profile mysql up) ───────
  mysql:
    image: docker.io/mysql:8.4
    profiles: [mysql]
    environment:
      MYSQL_DATABASE: fogwall
      MYSQL_USER: fogwall
      MYSQL_PASSWORD: fogwall
      MYSQL_ROOT_PASSWORD: fogwall
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ufogwall", "-pfogwall"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── MariaDB (optional — start with: docker compose --profile mariadb up) ───
  mariadb:
    image: docker.io/mariadb:11.4
    profiles: [mariadb]
    environment:
      MARIADB_DATABASE: fogwall
      MARIADB_USER: fogwall
      MARIADB_PASSWORD: fogwall
      MARIADB_ROOT_PASSWORD: fogwall
    ports:
      - "3307:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ufogwall", "-pfogwall"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── MongoDB (optional — start with: docker compose --profile mongo up) ─────
  mongo:
    image: docker.io/mongo:7
    profiles: [mongo]
    environment:
      MONGO_INITDB_ROOT_USERNAME: fogwall
      MONGO_INITDB_ROOT_PASSWORD: fogwall
      MONGO_INITDB_DATABASE: fogwall
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  # ── Database web UIs (optional) ───────────────────────────────────────────
  mongo-express:
    image: docker.io/mongo-express:1
    profiles: [mongo]
    depends_on:
      - mongo
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: fogwall
      ME_CONFIG_MONGODB_ADMINPASSWORD: fogwall
      ME_CONFIG_MONGODB_URL: mongodb://fogwall:fogwall@mongo:27017/
      ME_CONFIG_BASICAUTH: "false"
    ports:
      - "8081:8081"

  adminer:
    image: docker.io/adminer:4
    profiles: [postgres, mysql, mariadb]
    ports:
      - "8082:8080"

  # ── OpenTelemetry Collector (optional — start with: compose.sh --otel) ──────
  # Receives OTLP from fogwall and prints spans + metrics to its logs; also feeds traces to Jaeger.
  otel-collector:
    image: docker.io/otel/opentelemetry-collector-contrib:0.109.0
    profiles: [otel]
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      # :z so Podman relabels the file for SELinux (a plain :ro bind is unreadable to the container on
      # Podman+SELinux hosts). Harmless on Docker / non-SELinux, where the label option is ignored.
      - ./otel-collector-config.yml:/etc/otel-collector-config.yml:z
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    depends_on:
      - jaeger

  # ── Jaeger (optional — trace UI for the --otel stack) ──────────────────────
  # All-in-one accepts OTLP directly; the collector forwards traces here. UI at http://localhost:16686.
  jaeger:
    image: docker.io/jaegertracing/all-in-one:1.60
    profiles: [otel]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI

  # ── Prometheus (optional — metrics store for the --otel stack) ─────────────
  # Scrapes the metrics the collector re-exposes on :8889. Query/graph UI at http://localhost:9090.
  prometheus:
    image: docker.io/prom/prometheus:v3.1.0
    profiles: [otel]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:z
    ports:
      - "9090:9090"   # Prometheus UI
    depends_on:
      - otel-collector

  # ── Grafana (optional — metrics dashboards for the --otel stack) ───────────
  # Anonymous admin access (no login), Prometheus datasource and the fogwall dashboard auto-provisioned.
  # UI at http://localhost:3001 (3000 is taken by Gitea).
  grafana:
    image: docker.io/grafana/grafana:11.4.0
    profiles: [otel]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:z
      - ./grafana/dashboards:/var/lib/grafana/dashboards:z
    ports:
      - "3001:3000"   # Grafana UI
    depends_on:
      - prometheus

volumes:
  gitea-data:
  postgres-data:
  mysql-data:
  mariadb-data:
  mongo-data:
