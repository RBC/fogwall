# Prometheus scrape config for the local `--otel` stack. Scrapes the metrics the OTel Collector re-exposes on
# :8889/metrics, so fogwall's fogwall_push_* metrics land in Prometheus and can be graphed in Grafana.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']
