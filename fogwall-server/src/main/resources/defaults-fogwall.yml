# fogwall base configuration — shipped defaults only.
# See docs/configuration for the full reference, every optional section, and per-key guidance.

server:
  port: 8080
  approval-mode: auto
  heartbeat-interval-seconds: 10
  approval-timeout-seconds: 1800
  max-concurrent-requests: 512
  max-push-bytes: 67108864 # 64MiB
  max-object-size-bytes: 134217728 # 128MiB

database:
  type: h2-file # h2-mem | h2-file | postgres | mongo

providers:
  github:
    enabled: true
  gitlab:
    enabled: true
  codeberg:
    enabled: true
  gitea:
    enabled: false
  bitbucket:
    enabled: false

# Secret scanning via gitleaks — a scanner binary ships in the jar, so this works out of the box.
secret-scan:
  enabled: true

# Binary blob detection (opt-in; ENFORCE-only). See docs/configuration/binary-blob-detection.md.
binary-blob:
  enabled: false
  max-size-bytes: 52428800 # 50MiB
  deny-mime-types:
    - application/pdf
    - application/zip

# Content-pattern scanning (opt-in; PII/identifier bundles) — WARN on push, block on the SCM API path.
# See docs/configuration/content-pattern-scanning.md.
content-patterns:
  enabled: false
  bundles:
    - national-id-all-geos
    - generic-iban
    - generic-crypto-wallet
  scan-diff: true
  scan-commit-messages: true
  scan-scm-api: true

# Local single-admin auth for first run. Use OIDC/LDAP in production — see docs/configuration/authentication.md.
auth:
  provider: local

users:
  - username: admin
    password-hash: "{noop}admin"
    roles: [ADMIN]
    emails:
      - admin@example.com
