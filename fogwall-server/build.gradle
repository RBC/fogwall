plugins {
    id 'java'
    id 'application'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
        vendor = JvmVendorSpec.ADOPTIUM
    }
}

repositories {
    mavenCentral()
}

application {
    mainClass = 'com.rbc.fogwall.jetty.FogwallJettyApplication'
    applicationDefaultJvmArgs = ["-Dfogwall.pidfile=${buildDir}/fogwall.pid"]
}

tasks.named('run') {
    // Default to the 'local' profile so config/fogwall-local.yml is loaded in local dev.
    // Override by setting FOGWALL_CONFIG_PROFILES in your shell before running.
    environment 'FOGWALL_CONFIG_PROFILES', System.getenv('FOGWALL_CONFIG_PROFILES') ?: 'local'
    // Prepend the config directory to the runtime classpath so `fogwall-<profile>.yml` files that live OUTSIDE
    // src/main/resources — and therefore never ship in the jar or the image — are what the profiles resolve to.
    // Defaults to config/, which is gitignored and bootstrapped from the committed examples on first run.
    // Usage: ./gradlew :fogwall-server:run -PconfigDir=path/to/dir   (relative paths resolve against the repo root)
    if (!project.hasProperty('configDir')) {
        dependsOn rootProject.tasks.named('bootstrapConfig')
    }
    classpath = files(rootProject.file(project.findProperty('configDir') ?: 'config')) + classpath
    jvmArgs "-Dlog4j2.configurationFile=${projectDir}/src/main/resources/log4j2-local.xml"
    jvmArgs "-Dfogwall.pidfile=${buildDir}/fogwall.pid"
}

tasks.register('stop') {
    group = 'application'
    description = 'Stops the running fogwall server'
    doLast {
        def pf = file("${buildDir}/fogwall.pid")
        if (pf.exists()) {
            def pid = pf.text.trim()
            logger.lifecycle("Stopping fogwall (PID: ${pid})...")
            try {
                def proc = new ProcessBuilder('kill', pid).start()
                def exitCode = proc.waitFor()
                if (exitCode == 0) {
                    logger.lifecycle("Stopped fogwall server")
                } else {
                    logger.warn("Process ${pid} not found — may have already stopped")
                }
            } catch (Exception e) {
                logger.warn("Failed to kill process: ${e.message}")
            }
            pf.delete()
        } else {
            logger.warn("No PID file found. Is the server running?")
        }
    }
}

dependencies {
    // Core module
    implementation project(':fogwall-core')

    // SSH transport (server listener + JGit SSH client for upstream forwarding)
    implementation "org.apache.sshd:sshd-core:${minaSshdVersion}"
    implementation "org.eclipse.jgit:org.eclipse.jgit.ssh.apache:${jgitVersion}"

    // Gestalt config (YAML source brings SnakeYAML & Jackson 3 transitively)
    implementation "com.github.gestalt-config:gestalt-core:${gestaltVersion}"
    implementation "com.github.gestalt-config:gestalt-json-jackson3:${gestaltVersion}"
    implementation "com.github.gestalt-config:gestalt-yaml-jackson3:${gestaltVersion}"

    // Jackson YAML — validates config structure before Gestalt loads it; BOM pins the version
    implementation "tools.jackson.dataformat:jackson-dataformat-yaml"

    // OpenTelemetry SDK — this runnable module builds the OpenTelemetry instance from otel.* config and
    // hands it to fogwall-core. The API itself comes transitively from core. The alpha instrumentation BOM
    // version-manages the Log4j2 context-data bridge, which is a ServiceLoader ContextDataProvider that
    // copies trace_id/span_id into the ThreadContext for the log layout, so it is runtimeOnly.
    implementation platform("io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom-alpha:${opentelemetryInstrumentationAlphaBomVersion}")
    implementation "io.opentelemetry:opentelemetry-sdk"
    implementation "io.opentelemetry:opentelemetry-exporter-otlp"
    runtimeOnly "io.opentelemetry.instrumentation:opentelemetry-log4j-context-data-2.17-autoconfigure"

    // Database drivers - include all so standalone Jetty server can use any backend
    runtimeOnly "com.h2database:h2:${h2Version}"
    runtimeOnly "org.postgresql:postgresql:${postgresVersion}"
    runtimeOnly "com.mysql:mysql-connector-j:${mysqlVersion}"
    runtimeOnly "org.mariadb.jdbc:mariadb-java-client:${mariadbVersion}"
    runtimeOnly "org.mongodb:mongodb-driver-sync:${mongoVersion}"

    // Lombok
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    // Testing
    testImplementation "org.junit.jupiter:junit-jupiter-api:${junitVersion}"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${junitVersion}"
    testImplementation "org.mockito:mockito-core:${mockitoVersion}"
    testImplementation "org.junit.jupiter:junit-jupiter-params:${junitVersion}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:${junitVersion}"
    testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    // Testcontainers for e2e tests
    testImplementation "org.testcontainers:testcontainers:${testContainersVersion}"
    testImplementation "org.testcontainers:testcontainers-junit-jupiter:${testContainersVersion}"

    // H2 available at test runtime so the in-process proxy can use it
    testRuntimeOnly "com.h2database:h2:${h2Version}"

    // Include core coverage in the aggregated JaCoCo report
    jacocoAggregation project(':fogwall-core')
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'e2e'
    }
}

tasks.register('e2eTest', Test) {
    group = 'verification'
    description = 'Runs end-to-end tests that require a running container runtime'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'e2e'
    }
    // One JVM per class. The fixture boots a real server per class, and that configures JGit's process-wide window
    // cache; a second boot in the same JVM invalidates the pack handles the first one is still reading through.
    forkEvery = 1
    // Container startup can be slow
    timeout = java.time.Duration.ofMinutes(10)
}

tasks.named('check') {
    dependsOn tasks.named('testCodeCoverageReport', JacocoReport)
}

// testCodeCoverageReport aggregates fogwall-core's source sets, which include the
// generated-resources directory produced by downloadGitleaks. Declare the dependency
// explicitly so Gradle's task-ordering validation passes.
tasks.named('testCodeCoverageReport') {
    dependsOn ':fogwall-core:downloadGitleaks'
}
