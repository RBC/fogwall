name: Docker Build & Publish

on:
  push:
    branches: ["main", "release/*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      version:
        description: "Emergency: version tag to publish (e.g. v1.0.0-alpha.9)"
        required: true
        type: string

permissions:
  contents: read

# On main, give every commit its own concurrency group (via SHA) so build+scan runs never
# cancel each other — each landed commit is fully built and scanned in parallel. PR/other refs
# cancel superseded runs on new pushes.
concurrency:
  group: docker-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && github.ref != 'refs/heads/main' }}

jobs:
  build-and-push:
    name: Build & Push
    # Release tags are published by release-publish.yml, which promotes the already-built image.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dashboard
          - name: server
    # Matrix legs run in parallel, so PR wall-clock time is unchanged by adding the server image
    # — only total runner-minutes go up. Each leg writes its digest under a name-scoped output key
    # (digest_dashboard / digest_server) since matrix job outputs collapse to one value per key;
    # distinct keys per leg is the standard workaround so `scan` can look up the right digest.
    outputs:
      digest_dashboard: ${{ steps.export.outputs.digest_dashboard }}
      digest_server: ${{ steps.export.outputs.digest_server }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # ratchet:docker/setup-buildx-action@v4

      - name: Set image name
        run: |
          SUFFIX="${{ matrix.name == 'server' && '-server' || '' }}"
          echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')${SUFFIX}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # ratchet:docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image's version label is the project version this commit builds (X.Y.Z on a release
      # commit, X.Y.Z-SNAPSHOT otherwise). release-publish.yml relies on it to refuse a mismatched
      # promotion and to decide which convenience tags a release moves.
      - name: Read project version
        id: version
        run: |
          VERSION=$(sed -n "s/^[[:space:]]*version = '\([^']*\)'.*$/\1/p" build.gradle)
          if [[ -z "${VERSION}" || "${VERSION}" == *$'\n'* ]]; then
            echo "::error::expected exactly one version = '...' line in build.gradle, found: ${VERSION:-none}"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # ratchet:docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          tags: |
            type=ref,event=pr
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,prefix=build-,format=short,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') }}
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # ratchet:docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.name }}
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Export digest
        id: export
        run: echo "digest_${{ matrix.name }}=${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"

      - name: Attest image
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # ratchet:actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  scan:
    name: Container Scan
    needs: build-and-push
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dashboard
          - name: server
    permissions:
      contents: read
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    env:
      GRYPE_VERSION: "0.112.0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Set image name
        run: |
          SUFFIX="${{ matrix.name == 'server' && '-server' || '' }}"
          echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')${SUFFIX}" >> "$GITHUB_ENV"

      - name: Install grype
        run: |
          cd /tmp
          curl -sSfL -o "grype_${GRYPE_VERSION}_linux_amd64.tar.gz" \
            "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "grype_${GRYPE_VERSION}_checksums.txt" \
            "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_checksums.txt"
          grep "grype_${GRYPE_VERSION}_linux_amd64.tar.gz" "grype_${GRYPE_VERSION}_checksums.txt" | sha256sum --check
          tar -xzf "grype_${GRYPE_VERSION}_linux_amd64.tar.gz" -C /usr/local/bin grype

      - name: Scan image
        run: |
          DIGEST="${{ needs.build-and-push.outputs[format('digest_{0}', matrix.name)] }}"
          grype "${IMAGE}@${DIGEST}" \
            --config .grype.yaml \
            -o "template=grype-report.txt" \
            -o "json=grype-report.json"

      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7
        with:
          name: grype-container-scan-${{ matrix.name }}
          path: |
            grype-report.txt
            grype-report.json
          retention-days: 30
