name: License Compliance

permissions:
  contents: read

on:
  push:
    branches: ["main", "release/*"]
  pull_request:
    branches: ["main", "release/*"]

jobs:
  license-gradle:
    name: Gradle (license)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # ratchet:actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # ratchet:gradle/actions/setup-gradle@v6

      - name: Check licenses
        run: ./gradlew checkLicense -PskipFrontend

      - name: Upload license report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7
        with:
          name: gradle-license-report
          path: "**/build/reports/dependency-license/"
          retention-days: 30

  license-npm:
    name: npm (license)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Install dependencies
        run: npm ci --prefer-offline
        working-directory: fogwall-dashboard/frontend

      - name: Check licenses
        run: npm run license-check
        working-directory: fogwall-dashboard/frontend
